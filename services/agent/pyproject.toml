[project]
name = "nexora-agent"
version = "0.1.0"
description = "Nexora agentic learning backend and MCP server"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.34",
  "pydantic>=2.10",
  "strands-agents>=1.0",
  "bedrock-agentcore>=1.0",
  "boto3>=1.40",
  "mcp[cli]>=2.0,<3"
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "httpx>=0.28"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
