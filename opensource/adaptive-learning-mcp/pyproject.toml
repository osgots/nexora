[project]
name = "adaptive-learning-mcp"
version = "0.1.0"
description = "Deterministic mastery, recall and prioritization tools exposed over MCP"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["mcp[cli]>=2.0,<3"]

[project.optional-dependencies]
dev = ["pytest>=8.3"]

[project.scripts]
adaptive-learning-mcp = "adaptive_learning_mcp.server:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/adaptive_learning_mcp"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
